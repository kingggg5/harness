name: release-gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: Portability validation
        run: python skills/best-in-code/scripts/validate_portability.py
      - name: CI policy regression suite
        run: python scripts/check_eval_results_tests.py
      - name: Workflow supply-chain policy
        run: python scripts/check_workflow_policy.py
      - name: Pinned-runtime doctor regression suite
        run: python skills/best-in-code/scripts/doctor_runtime_tests.py
      - name: Executable agent-graph integration suite
        run: python skills/best-in-code/scripts/execution_runtime_tests.py
      - name: Context, tool-contract, eval, and trace suite
        run: python skills/best-in-code/scripts/context_eval_trace_tests.py
      - name: Loop-contract invariant suite
        run: python skills/best-in-code/scripts/loop_tests.py
      - name: Loop runtime integration suite
        run: python skills/best-in-code/scripts/loop_runtime_tests.py
      - name: Task-graph invariant suite
        run: python skills/best-in-code/scripts/graph_tests.py
      - name: Graph runtime integration suite
        run: python skills/best-in-code/scripts/graph_runtime_tests.py
      - name: Two-process race regression suite
        run: python skills/best-in-code/scripts/race_tests.py
      - name: Memory evals with explicit coverage policy
        shell: bash
        env:
          HARNESS_RUNNER_OS: ${{ runner.os }}
        run: |
          set -euo pipefail
          python skills/best-in-code/scripts/run_memory_evals.py --json > evals.json
          python scripts/check_eval_results.py --results evals.json --os "$HARNESS_RUNNER_OS"
      - name: Verify release package allowlist
        run: npm run pack:check
      - name: SBOM generation regression suite
        run: npm run test:sbom
