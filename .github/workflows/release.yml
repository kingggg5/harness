name: publish-release-package

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Match tag to package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e "const p=require('./package.json'); const tag=process.argv[1]; if ('v'+p.version !== tag) throw new Error('tag must equal v'+p.version)" "$RELEASE_TAG"
      - name: Run deterministic release gates
        run: npm test
      - name: Verify package allowlist and version parity
        run: npm run pack:check
      - name: Build and smoke-install release archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist .release-smoke
          npm pack --ignore-scripts --pack-destination dist
          archive="$(find "$PWD/dist" -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          test -n "$archive"
          npm install --ignore-scripts --no-audit --no-fund --prefix .release-smoke -- "$archive"
          node .release-smoke/node_modules/@kingggg5/harness/bin/harness.js --help >/dev/null
          (cd dist && sha256sum *.tgz > SHA256SUMS)
      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          archive="$(find dist -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          gh release create "$GITHUB_REF_NAME" \
            "$archive#npm install archive" \
            "dist/SHA256SUMS#SHA-256 checksums" \
            --verify-tag \
            --generate-notes \
            --title "Harness $GITHUB_REF_NAME"
