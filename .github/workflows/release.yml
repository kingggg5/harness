name: publish-release-package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag matching package.json, for example v0.6.0"
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Resolve and validate release tag
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "::error::Manual releases must run from the default branch ($DEFAULT_BRANCH)"
            exit 1
          fi
          node -e "const p=require('./package.json'); const tag=process.argv[1]; if ('v'+p.version !== tag) throw new Error('tag must equal v'+p.version)" "$REQUESTED_TAG"
          echo "RELEASE_TAG=$REQUESTED_TAG" >> "$GITHUB_ENV"
      - name: Ensure manual tag is new
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Tag $RELEASE_TAG already exists"
            exit 1
          fi
      - name: Run deterministic release gates
        run: npm test
      - name: Enforce workflow supply-chain policy
        run: python scripts/check_workflow_policy.py
      - name: Verify package allowlist and version parity
        run: npm run pack:check
      - name: Build and smoke-install release archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist .release-smoke
          npm pack --ignore-scripts --pack-destination dist
          archive="$(find "$PWD/dist" -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          test -n "$archive"
          npm install --ignore-scripts --no-audit --no-fund --prefix .release-smoke -- "$archive"
          node .release-smoke/node_modules/@kingggg5/harness/bin/harness.js portability --json
          npm run sbom:generate -- --archive "$archive" --output dist/harness.spdx.json
          (cd dist && sha256sum *.tgz *.spdx.json > SHA256SUMS)
      - name: Create annotated tag for manual release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tagged_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          tag_sha="$(
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/tags" \
              -f "tag=$RELEASE_TAG" \
              -f "message=Harness $RELEASE_TAG" \
              -f "object=$GITHUB_SHA" \
              -f "type=commit" \
              -f "tagger[name]=github-actions[bot]" \
              -f "tagger[email]=41898282+github-actions[bot]@users.noreply.github.com" \
              -f "tagger[date]=$tagged_at" \
              --jq '.sha'
          )"
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/$RELEASE_TAG" \
            -f "sha=$tag_sha"
      - name: Attest release build provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: dist/*.tgz
      - name: Attest release SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: dist/*.tgz
          sbom-path: dist/harness.spdx.json
      - name: Publish verified GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          archive="$(find dist -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          gh release create "$RELEASE_TAG" \
            "$archive#npm install archive" \
            "dist/harness.spdx.json#SPDX 2.3 software bill of materials" \
            "dist/SHA256SUMS#SHA-256 checksums" \
            --verify-tag \
            --generate-notes \
            --title "Harness $RELEASE_TAG"
